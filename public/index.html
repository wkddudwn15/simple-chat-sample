<!DOCTYPE html>
<html>
  <head>
    <title>Socket.IO chat</title>
    <style>
      :root {
        --page-bg: #fff4fa;
        --page-dot: rgba(255, 179, 214, 0.38);
        --page-heart: rgba(255, 122, 168, 0.16);
        --header-bg: rgba(255, 255, 255, 0.82);
        --panel-bg: rgba(255, 232, 242, 0.92);
        --primary: #ff7aa8;
        --primary-dark: #ee5f91;
        --accent: #79d8d0;
        --accent-soft: #d7fbf7;
        --message-me: #ffdceb;
        --message-other: #ffffff;
        --text: #4b3340;
        --muted-text: #9a7485;
        --line: #ffd0e3;
      }
      body {
        margin: 0;
        padding: 4.75rem 0 4.25rem;
        background-color: var(--page-bg);
        background-image:
          radial-gradient(var(--page-dot) 1.1px, transparent 1.1px),
          radial-gradient(var(--page-heart) 2px, transparent 2px);
        background-position: 0 0, 9px 10px;
        background-size: 18px 18px, 44px 44px;
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .chat-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 4rem;
        background:
          linear-gradient(90deg, rgba(255, 224, 238, 0.9), rgba(215, 251, 247, 0.9)),
          var(--header-bg);
        border-bottom: 1px solid rgba(255, 208, 227, 0.85);
        backdrop-filter: blur(12px);
        box-shadow: 0 6px 20px rgba(255, 122, 168, 0.12);
      }
      .chat-header::before,
      .chat-header::after {
        content: "";
        position: absolute;
        bottom: -0.45rem;
        width: 3.8rem;
        height: 0.9rem;
        background: #fff;
        border: 1px solid rgba(255, 208, 227, 0.9);
        border-radius: 999px;
        box-shadow: 0 3px 10px rgba(255, 122, 168, 0.1);
      }
      .chat-header::before {
        left: 1rem;
      }
      .chat-header::after {
        right: 1rem;
      }
      .chat-title {
        margin: 0;
        color: var(--primary-dark);
        font-size: 1.22rem;
        font-weight: 800;
        letter-spacing: 0;
        text-shadow: 0 2px 0 rgba(255, 255, 255, 0.8);
      }
      .chat-title::before,
      .chat-title::after {
        content: "♡";
        color: var(--accent);
        font-size: 0.9rem;
        margin: 0 0.45rem;
      }
      #form { background: var(--panel-bg); padding: 0.45rem 0.65rem; position: fixed; bottom: 0; left: 0; right: 0; display: flex; gap: 0.45rem; min-height: 3.4rem; box-sizing: border-box; backdrop-filter: blur(12px); border-top: 1px solid rgba(255, 208, 227, 0.85); box-shadow: 0 -6px 22px rgba(255, 122, 168, 0.14); }
      #input { border: 1px solid var(--line); padding: 0 1rem; flex-grow: 1; border-radius: 999px; margin: 0; color: var(--text); background: #fff; box-shadow: inset 0 1px 3px rgba(75, 51, 64, 0.06), 0 2px 0 rgba(255, 255, 255, 0.75); }
      #input::placeholder { color: #c29aaa; }
      #input:focus { outline: 3px solid rgba(100, 207, 196, 0.28); border-color: var(--accent); }
      #form > button { background: linear-gradient(180deg, #ff94bc, var(--primary)); border: none; padding: 0 1.1rem; margin: 0; border-radius: 999px; outline: none; color: #fff; font-weight: 800; box-shadow: 0 4px 12px rgba(238, 95, 145, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.42); }
      #form > button:hover { background: var(--primary-dark); }
      #form > button:active { transform: translateY(1px); }
      #messages { list-style-type: none; margin: 0; padding: 0; width: 100%; }
      .message-item {
        display: flex;
        align-items: flex-start;
        margin-bottom: 1rem;
        max-width: 70%;
      }
      .message-item.me {
        margin-left: auto;
        flex-direction: row-reverse;
      }
      .user-icon {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        margin: 0 10px;
        flex-shrink: 0;
        border: 3px solid #fff;
        box-shadow: 0 3px 10px rgba(75, 51, 64, 0.14);
      }
      .message-content {
        display: flex;
        flex-direction: column;
      }
      .message-item.me .message-content {
        align-items: flex-end;
      }
      .username {
        font-size: 0.8rem;
        color: var(--muted-text);
        margin-bottom: 0.2rem;
        font-weight: 700;
      }
      .message-bubble {
        position: relative;
        padding: 0.65rem 0.95rem;
        border-radius: 1.15rem;
        word-wrap: break-word;
        line-height: 1.45;
      }
      .me .message-bubble {
        background: var(--message-me);
        border-top-right-radius: 0.35rem;
        box-shadow: 0 3px 10px rgba(255, 122, 168, 0.16);
      }
      .me .message-bubble::after {
        content: "";
        position: absolute;
        top: 0.45rem;
        right: -0.35rem;
        width: 0.7rem;
        height: 0.7rem;
        background: var(--message-me);
        border-radius: 0.15rem 0 0.15rem 0;
        transform: rotate(45deg);
      }
      .other .message-bubble {
        background: var(--message-other);
        border-top-left-radius: 0.35rem;
        box-shadow: 0 3px 10px rgba(75, 51, 64, 0.08);
      }
      .other .message-bubble::before {
        content: "";
        position: absolute;
        top: 0.45rem;
        left: -0.35rem;
        width: 0.7rem;
        height: 0.7rem;
        background: var(--message-other);
        border-radius: 0 0.15rem 0 0.15rem;
        transform: rotate(45deg);
      }
      .system-message {
        text-align: center;
        color: var(--muted-text);
        font-style: italic;
        margin: 0.7rem auto;
        font-size: 0.9rem;
        background: rgba(255, 255, 255, 0.68);
        border: 1px solid rgba(255, 208, 227, 0.8);
        border-radius: 999px;
        padding: 0.35rem 0.8rem;
        width: fit-content;
        box-shadow: 0 2px 8px rgba(255, 122, 168, 0.08);
      }
      #messages-container {
        padding: 0 1rem;
      }
    </style>
  </head>
  <body>
    <header class="chat-header">
      <h1 class="chat-title">ふわっとチャット</h1>
    </header>
    <div id="messages-container">
      <ul id="messages"></ul>
    </div>
    <form id="form" action="">
      <input id="input" autocomplete="off" placeholder="メッセージを入力" /><button>送信</button>
    </form>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      const socket = io();

      let clientId = sessionStorage.getItem('clientId');
      if (!clientId) {
        clientId = Math.random().toString(36).substring(2, 15);
        sessionStorage.setItem('clientId', clientId);
      }
      // Notify the server that a user has connected with a clientId
      socket.emit('user connected', clientId);

      const form = document.getElementById('form');
      const input = document.getElementById('input');
      const messages = document.getElementById('messages');

      function getColorFromId(id) {
        let hash = 0;
        for (let i = 0; i < id.length; i++) {
          hash = id.charCodeAt(i) + ((hash << 5) - hash);
        }
        const h = Math.abs(hash % 360);
        return `hsl(${h}, 60%, 65%)`;
      }

      function displaySystemMessage(message) {
        const item = document.createElement('li');
        item.className = 'system-message';
        item.textContent = message;
        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
      }

      form.addEventListener('submit', (e) => {
        e.preventDefault();
        if (input.value) {
          const messageData = { id: clientId, msg: input.value };
          socket.emit('chat message', messageData);
          input.value = '';
        }
      });

      socket.on('welcome', (id) => {
        displaySystemMessage(`あなたのユーザIDは ${id.substring(0, 6)} です`);
      });

      socket.on('user joined', (id) => {
        displaySystemMessage(`ユーザ ${id.substring(0, 6)} が参加しました`);
      });

      socket.on('user left', (id) => {
        displaySystemMessage(`ユーザ ${id.substring(0, 6)} が退出しました`);
      });

      socket.on('chat message', (data) => {
        const item = document.createElement('li');
        item.classList.add('message-item');

        const isMe = data.id === clientId;
        if (isMe) {
          item.classList.add('me');
        } else {
          item.classList.add('other');
        }

        const userIcon = document.createElement('img');
        userIcon.src = 'userIcon.png';
        userIcon.classList.add('user-icon');
        userIcon.style.backgroundColor = getColorFromId(data.id);

        const messageContent = document.createElement('div');
        messageContent.classList.add('message-content');

        const username = document.createElement('div');
        username.classList.add('username');
        username.textContent = data.id.substring(0, 6);

        const messageBubble = document.createElement('div');
        messageBubble.classList.add('message-bubble');
        messageBubble.textContent = data.msg;

        messageContent.appendChild(username);
        messageContent.appendChild(messageBubble);

        item.appendChild(userIcon);
        item.appendChild(messageContent);

        messages.appendChild(item);
        window.scrollTo(0, document.body.scrollHeight);
      });
    </script>
  </body>
</html>
